workflows:
  ios-release:
    name: FitTrack iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - fittrack_mobile
      ios_signing:
        distribution_type: app_store
        bundle_identifier: $BUNDLE_ID
      vars:
        BUILD_NAME: 1.0.0
        XCODE_WORKSPACE: Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
    scripts:
      - name: Generate Flutter native iOS and Android projects
        script: |
          cd mobile
          flutter create --platforms=ios,android --org com.fittrack .
      - name: Set iOS bundle identifier
        script: |
          cd mobile
          if [ -n "${BUNDLE_ID:-}" ]; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" ios/Runner.xcodeproj/project.pbxproj
          fi
      - name: Apply Firebase options from Codemagic secret
        script: |
          cd mobile
          if [ -n "${FIREBASE_OPTIONS_DART_BASE64:-}" ]; then
            echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          fi
      - name: Get Flutter packages
        script: |
          cd mobile
          flutter pub get
      - name: Generate localization files
        script: |
          cd mobile
          flutter gen-l10n
      - name: Install iOS pods
        script: |
          cd mobile
          find ios -name "Podfile" -execdir pod install \;
      - name: Run Flutter analyzer
        script: |
          cd mobile
          flutter analyze
      - name: Run Flutter tests
        script: |
          cd mobile
          flutter test
      - name: Set up iOS code signing
        script: |
          cd mobile
          xcode-project use-profiles
      - name: Build signed iOS IPA
        script: |
          cd mobile
          BUILD_NUMBER=${BUILD_NUMBER:-$PROJECT_BUILD_NUMBER}
          BUILD_NUMBER=${BUILD_NUMBER:-1}
          flutter build ipa --release \
            --build-name=$BUILD_NAME \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=REQUIRE_HTTPS=${REQUIRE_HTTPS:-true} \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - mobile/flutter_drive.log

  ios-simulator-check:
    name: FitTrack iOS Simulator Check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - fittrack_mobile
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Generate Flutter native projects
        script: |
          cd mobile
          flutter create --platforms=ios,android --org com.fittrack .
      - name: Set iOS bundle identifier
        script: |
          cd mobile
          if [ -n "${BUNDLE_ID:-}" ]; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" ios/Runner.xcodeproj/project.pbxproj
          fi
      - name: Apply Firebase options from Codemagic secret
        script: |
          cd mobile
          if [ -n "${FIREBASE_OPTIONS_DART_BASE64:-}" ]; then
            echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          fi
      - name: Get Flutter packages
        script: |
          cd mobile
          flutter pub get
      - name: Generate localization files
        script: |
          cd mobile
          flutter gen-l10n
      - name: Analyze and test
        script: |
          cd mobile
          flutter analyze
          flutter test
      - name: Build iOS simulator app
        script: |
          cd mobile
          flutter build ios --simulator --debug \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --dart-define=REQUIRE_HTTPS=${REQUIRE_HTTPS:-true}
