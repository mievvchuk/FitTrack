name: FitTrack CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fittrack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests and migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fittrack_test
          POSTGRES_USER: fittrack
          POSTGRES_PASSWORD: fittrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fittrack -d fittrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://fittrack:fittrack@localhost:5432/fittrack_test
      JWT_SECRET_KEY: ci-only-secret-for-tests-change-in-production
      RATE_LIMIT_STORAGE_URI: memory://
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      ALLOWED_ORIGINS: http://localhost,http://127.0.0.1
      ENFORCE_HTTPS: "false"
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run PostgreSQL migrations
        run: alembic -c alembic.ini upgrade head

      - name: Run backend tests
        run: pytest -q --cov=app --cov-report=term-missing

  flutter-tests:
    name: Flutter analyze and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  flutter-build-android:
    name: Build Flutter Android artifact
    runs-on: ubuntu-24.04
    needs: flutter-tests
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Android platform files for CI build
        run: flutter create --platforms=android .

      - name: Build debug APK
        run: >
          flutter build apk --debug
          --dart-define=API_BASE_URL=https://api.fittrack.example/api/v1
          --dart-define=REQUIRE_HTTPS=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: fittrack-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  docker-build:
    name: Build backend Docker image
    runs-on: ubuntu-24.04
    needs: backend-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: fittrack-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
