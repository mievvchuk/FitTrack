name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "database/**"
      - "deploy/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fittrack-production-backend
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push backend image
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare image name
        id: image
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          IMAGE="ghcr.io/${OWNER}/fittrack-backend:${GITHUB_SHA}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to cloud server
    runs-on: ubuntu-24.04
    needs: build-and-push
    environment: production
    env:
      CLOUD_HOST: ${{ secrets.CLOUD_HOST }}
      CLOUD_USER: ${{ secrets.CLOUD_USER }}
      CLOUD_PORT: ${{ secrets.CLOUD_PORT || 22 }}
      BACKEND_IMAGE: ${{ needs.build-and-push.outputs.image }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.CLOUD_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${CLOUD_PORT}" "${CLOUD_HOST}" >> ~/.ssh/known_hosts

      - name: Upload deployment compose file
        run: |
          ssh -p "${CLOUD_PORT}" "${CLOUD_USER}@${CLOUD_HOST}" "mkdir -p ~/fittrack"
          scp -P "${CLOUD_PORT}" deploy/docker-compose.prod.yml "${CLOUD_USER}@${CLOUD_HOST}:~/fittrack/docker-compose.prod.yml"

      - name: Deploy backend
        run: |
          ssh -p "${CLOUD_PORT}" "${CLOUD_USER}@${CLOUD_HOST}" \
            BACKEND_IMAGE="${BACKEND_IMAGE}" \
            GHCR_TOKEN="${GHCR_TOKEN}" \
            GITHUB_ACTOR="${GITHUB_ACTOR}" \
            POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            DATABASE_URL="${DATABASE_URL}" \
            FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID}" \
            STRIPE_SECRET_KEY="${STRIPE_SECRET_KEY}" \
            STRIPE_WEBHOOK_SECRET="${STRIPE_WEBHOOK_SECRET}" \
            JWT_SECRET_KEY="${JWT_SECRET_KEY}" \
            ALLOWED_HOSTS="${ALLOWED_HOSTS}" \
            ALLOWED_ORIGINS="${ALLOWED_ORIGINS}" \
            "bash -s" <<'REMOTE'
          set -euo pipefail

          cd ~/fittrack

          cat > .env <<ENV
          BACKEND_IMAGE=${BACKEND_IMAGE}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          DATABASE_URL=${DATABASE_URL}
          FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          RATE_LIMIT_STORAGE_URI=memory://
          ALLOWED_HOSTS=${ALLOWED_HOSTS}
          ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
          ENFORCE_HTTPS=true
          RUN_MIGRATIONS=true
          ENV

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker image prune -f
          docker compose -f docker-compose.prod.yml ps
          REMOTE
