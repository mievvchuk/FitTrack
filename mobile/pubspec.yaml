name: fittrack
description: FitTrack mobile application for personal workouts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  dio: ^5.11.0
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_riverpod: ^3.4.1
  flutter_secure_storage: ^10.3.1
  go_router: ^17.3.0
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  local_auth: ^3.0.2
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/exercises/
